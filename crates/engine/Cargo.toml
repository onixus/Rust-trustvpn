[package]
name = "rtrust-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rtrust-profile.workspace = true
tokio.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
bytes = "1"
blake2 = "0.10"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
rand = "0.9"
sha2 = "0.10"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Only for the RttEstimator type in the congestion-controller trait.
quinn-proto = { version = "0.11", default-features = false }
http = "1"
url = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ipnet = "2"
serde.workspace = true
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
serde_json.workspace = true
rcgen = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
webpki-roots = "1"
