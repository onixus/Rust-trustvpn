[package]
name = "rtrust-journal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rtrust-engine.workspace = true
rtrust-profile.workspace = true
directories = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Threading", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
