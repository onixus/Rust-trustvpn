plugins { id 'com.android.application' }
android {
    namespace 'org.rtrusttunnel.android'
    compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId 'org.rtrusttunnel.android'
        minSdk 29
        targetSdk 36
        versionCode = (project.findProperty('rtrustVersionCode') ?: '50001').toInteger()
        versionName '0.5.0-preview.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'org.rtrusttunnel.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
