plugins { id 'com.android.application' }
android {
    namespace 'org.rtrusttunnel.android'
    compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId 'org.rtrusttunnel.android'
        minSdk 29
        targetSdk 36
        versionCode = (project.findProperty('rtrustVersionCode') ?: '30201').toInteger()
        versionName '0.3.2-preview.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'org.rtrusttunnel.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
