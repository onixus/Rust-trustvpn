plugins { id 'com.android.application' }
android {
    namespace 'org.rtrusttunnel.android'
    compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig {
        def tv = project.hasProperty('rtrustTv')
        applicationId (tv ? 'org.rtrusttunnel.android.tv' : (project.findProperty('rtrustApplicationId') ?: 'org.rtrusttunnel.android').toString())
        minSdk 29
        targetSdk 36
        versionCode = (project.findProperty('rtrustVersionCode') ?: (tv ? '70004' : '70005')).toInteger()
        versionName tv ? '0.7.1-tv.3' : '0.7.1'
        manifestPlaceholders = [appLabel: tv ? 'R-TrustTunnel TV' : 'R-TrustTunnel']
        resValue 'bool', 'rtrust_tv', tv ? 'true' : 'false'
        if (tv) ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } else ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'org.rtrusttunnel.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    if (project.hasProperty('rtrustTv')) implementation project(':tvmeta')
}
