<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R-TrustTunnel</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>R-TrustTunnel</strong><span>WebView</span></header><button id="connect" class="primary">Connect</button><p id="status" role="status"></p>
<main><section><h2>Profiles</h2><div id="profiles"></div><textarea id="input" placeholder="Paste a profile, tt:// or hy2:// link" aria-label="Profile import"></textarea><button id="paste">Preview import</button><button id="file">Import file</button><div id="preview"></div><button id="pending">Confirm pending import</button></section>
<section><h2>Connection</h2><label>Mode <select id="mode"><option value="Socks">SOCKS5</option><option value="Tun">Selected IPv4 networks</option><option value="Full">Whole device VPN</option></select></label><label>SOCKS port <input id="port" type="number" min="1" max="65535"></label><label>IPv4 networks <input id="networks" placeholder="192.0.2.0/24"></label><label>DNS <input id="dns"></label><label><input id="auto" type="checkbox"> Connect on launch</label><button id="save">Save settings</button></section>
<section><h2>Server profiles</h2><label>Portal HTTPS address <input id="address" type="url"></label><label>Enrollment code <input id="code" type="password" autocomplete="off"></label><label>Device name <input id="name" value="Desktop"></label><button id="enroll">Register device</button><button id="sync">Sync profiles</button><label><input id="syncauto" type="checkbox"> Background synchronization</label><button id="forget">Forget registration</button></section></main><script src="app.js"></script></body></html>
