[package]
name = "rtrust-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rtrust-desktop.workspace = true
rtrust-update.workspace = true
rtrust-portal.workspace = true
rtrust-profile.workspace = true
rtrust-engine.workspace = true
rtrust-store.workspace = true
rtrust-control.workspace = true
tokio.workspace = true
zeroize.workspace = true
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "wayland"] }
rfd = "0.17"
directories = "6"
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
# softbuffer ignores alpha on macOS; Metal-backed wgpu preserves the glass backdrop.
iced = { version = "0.14", default-features = false, features = ["wgpu"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "5.19"
default-features = false
features = ["tokio"]

[target.'cfg(target_os = "linux")'.dependencies.futures-util]
version = "0.3"

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-winres = "0.3.6"
