<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.rtrusttunnel.Service"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.rtrusttunnel.Service" send_interface="org.rtrusttunnel.Service" send_member="OpenChannel"/>
  </policy>
</busconfig>
