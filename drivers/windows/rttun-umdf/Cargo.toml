[package]
name = "rttun-umdf"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "UMDF host for the R-TrustTunnel adapter. Not a packet path until it exposes a network interface."

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 31

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.6"

[dependencies]
wdk = "0.5"
wdk-panic = "0.5"
wdk-sys = "0.5"
