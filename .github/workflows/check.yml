name: Native preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-xcb-dev libdbus-1-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev python3-venv libandroid-json-java
      - run: python ci/test_tools.py
      - run: python ci/test_windows_recovery.py
      - if: runner.os != 'Windows'
        run: python ci/test_android_lifecycle_e2e.py
      - run: python scripts/test-android-tunnel-lifecycle.py
      - run: python ci/test_source_provenance.py
      - run: python ci/test_windows_handoff.py
      - run: python ci/test_release_acceptance.py
      - run: python ci/test_publish_signed_release.py
      - run: python scripts/test-acceptance-matrix.py
      - run: python scripts/test-android-sleep-observer.py
      - if: runner.os == 'Linux'
        run: python scripts/test-android-portal-sync.py
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path vendor/h2/Cargo.toml --lib --locked -- --skip hpack::test::fixture
        env:
          CARGO_TARGET_DIR: target/h2-tests
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release -p rtrust-native -p rtrust-update --locked
      - run: python scripts/package-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-${{ runner.os }}
          path: dist/
